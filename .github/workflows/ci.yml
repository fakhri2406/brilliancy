name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out with full history so commitlint can walk the pull request range
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm at the version pinned in the root packageManager field
        uses: pnpm/action-setup@v6

      - name: Install Node at the version pinned in .nvmrc and cache the pnpm store
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies from the lockfile without resolving anything new
        run: pnpm install --frozen-lockfile

      - name: Check every commit in the pull request range against Conventional Commits
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Enforce the section 4.2 package graph
        run: pnpm run check:deps

      - name: Enforce the no-comment convention across TypeScript and JavaScript sources
        run: pnpm run check:comments

      - name: Lint and check formatting with Biome
        run: pnpm run lint

      - name: Typecheck every workspace
        run: pnpm run typecheck

      - name: Build every workspace
        run: pnpm run build

      - name: Run the unit tests
        run: pnpm run test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch under test
        uses: actions/checkout@v7

      - name: Install pnpm at the version pinned in the root packageManager field
        uses: pnpm/action-setup@v6

      - name: Install Node at the version pinned in .nvmrc and cache the pnpm store
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies from the lockfile without resolving anything new
        run: pnpm install --frozen-lockfile

      - name: Install only the Chromium and WebKit browsers the suite runs in
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Build the web app so Playwright previews what actually ships
        run: pnpm run build

      - name: Run the Playwright suite in Chromium and WebKit
        run: pnpm run test:e2e

      - name: Upload the Playwright HTML report so a failure is readable without a rerun
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
